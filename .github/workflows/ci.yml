name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify lockfile
        run: uv lock --check
      - name: Run tests
        run: >-
          uv run --extra test --extra api python -m pytest -q
          --cov=a1_factor_engine --cov-branch --cov-report=term-missing
          --cov-fail-under=85
      - name: Verify true-data harness coverage
        run: >-
          uv run --extra test --extra acceptance-tools python -m pytest -q tests/test_true_data_acceptance.py
          --cov=tools.true_data_acceptance --cov-branch --cov-report=term-missing
          --cov-fail-under=30
      - name: Verify evaluator critical-path branch coverage
        run: >-
          uv run --extra test --extra api python -m pytest -q tests/test_factorbench.py
          --cov=a1_factor_engine.evaluation.models
          --cov=a1_factor_engine.evaluation.runner
          --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Verify energy database build dependencies
        run: >-
          uv run --extra energy-db-build python -c
          "import openpyxl, pdfplumber; assert openpyxl and pdfplumber"
      - name: Compile sources
        run: uv run --extra test python -m compileall -q src tests tools
      - name: Lint
        run: uv run --extra test ruff check .
      - name: Type check
        run: uv run --extra test mypy src tools/true_data_acceptance.py
      - name: Run FactorBench
        run: uv run --extra test cfr benchmark run data/benchmarks/factorbench_v1.jsonl > factorbench-run.json
      - name: Run FactorBench V2
        run: uv run --extra test cfr benchmark run data/benchmarks/factorbench_v2.jsonl > factorbench-v2-run.json
      - name: Run Frozen Unit Regression Set
        run: uv run --extra test python tools/unit_holdout.py --compact > frozen-unit-regression.json
      - name: Run Portfolio Challenge
        run: >-
          uv run --extra test --extra api python tools/portfolio_validation.py
          --output outputs/portfolio_validation
      - name: Upload Portfolio Challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-validation-${{ github.sha }}
          path: outputs/portfolio_validation/
          if-no-files-found: error
      - name: Build package
        run: uv build
      - name: Verify release archive contents
        run: uv run --extra test python tools/verify_release_artifacts.py dist/*.whl dist/*.tar.gz

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Record image digest
        run: docker image inspect carbonfactorresolver-resolver --format='{{.Id}}' > docker-image-digest.txt
      - name: Start and verify health
        run: |
          docker compose up -d
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' carbonfactorresolver-resolver-1 2>/dev/null || true)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Upload container digest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-digest-${{ github.sha }}
          path: docker-image-digest.txt
          if-no-files-found: error
