name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify lockfile
        run: uv lock --check
      - name: Run tests
        run: >-
          uv run --extra test python -m pytest -q
          --cov=a1_factor_engine --cov-branch --cov-report=term-missing
          --cov-fail-under=85
      - name: Compile sources
        run: uv run --extra energy-import python -m compileall -q src tests tools
      - name: Check imports and undefined names
        run: uvx ruff check --select I,F src tests tools
      - name: Build package
        run: uv build
