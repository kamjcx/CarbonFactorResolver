[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-factor-resolver"
version = "0.14.4"
description = "Evidence-governed carbon-factor resolution for materials, energy and processes"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
test = [
  "hypothesis>=6,<7",
  "httpx>=0.27",
  "mypy>=1.14",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=6",
  "ruff>=0.9",
]
acceptance-tools = ["pdfplumber>=0.11", "python-docx>=1.1"]
energy-db-build = ["pdfplumber>=0.11", "openpyxl>=3.1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
supply-chain = [
  "bandit==1.9.4",
  "cyclonedx-bom==7.3.1",
  "pip-audit==2.10.1",
]

[project.scripts]
cfr = "a1_factor_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a1_factor_engine = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "py.typed"]

[tool.setuptools.data-files]
"share/carbon-factor-resolver/benchmarks" = ["data/benchmarks/*.jsonl"]
"share/carbon-factor-resolver/fixtures/catalog" = ["data/fixtures/catalog/*.json"]
"share/carbon-factor-resolver/fixtures/external" = ["data/fixtures/external/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "ASYNC", "S", "RUF100"]
# StrEnum rewrites can alter public repr/type contracts; retain explicit str+Enum
# until a separately versioned API migration.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Pytest uses assert by design and secret-shaped placeholders to prove redaction.
"tests/**/*.py" = ["S101", "S105", "S106"]
# These tests intentionally invoke the repository-controlled git executable.
"tests/test_public_release.py" = ["S607"]
# Offline QA tools intentionally use deterministic PRNGs, synchronous filesystem
# access, and fixed local executables; inputs are repository-controlled.
"tools/**/*.py" = ["ASYNC240", "S101", "S311", "S603", "S607"]
# FastAPI's declarative Body(...) defaults are required for OpenAPI generation.
"src/a1_factor_engine/api.py" = ["B008"]
[tool.mypy]
python_version = "3.11"
packages = ["a1_factor_engine"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
