[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-factor-resolver"
version = "0.13.1"
description = "Evidence-governed carbon-factor resolution for materials, energy and processes"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
test = [
  "hypothesis>=6,<7",
  "httpx>=0.27",
  "mypy>=1.14",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=6",
  "ruff>=0.9",
]
acceptance-tools = ["pdfplumber>=0.11", "python-docx>=1.1"]
energy-db-build = ["pdfplumber>=0.11", "openpyxl>=3.1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
cfr = "a1_factor_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a1_factor_engine = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "py.typed"]

[tool.setuptools.data-files]
"share/carbon-factor-resolver/benchmarks" = ["data/benchmarks/*.jsonl"]
"share/carbon-factor-resolver/fixtures/catalog" = ["data/fixtures/catalog/*.json"]
"share/carbon-factor-resolver/fixtures/external" = ["data/fixtures/external/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
packages = ["a1_factor_engine"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

# The pre-0.13 numerical/registry core is runtime-validated and is being typed
# incrementally. New delivery, connector, diagnostic and evaluation modules
# remain under strict checking above.
[[tool.mypy.overrides]]
module = [
  "a1_factor_engine.energy_database",
  "a1_factor_engine.engine",
  "a1_factor_engine.material_registry",
  "a1_factor_engine.semantic_index",
  "a1_factor_engine.units",
]
ignore_errors = true
