services:
  resolver:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CFR_LIVE_CONNECTORS: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
